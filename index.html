<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Paint the correct palette before React mounts. Without this, a visitor
      who chose the light theme sees a dark flash on every hard navigation.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          // Dark is the designed default for every first-time visitor; only an
          // explicit choice made with the theme toggle switches to light.
          var theme = stored === 'light' ? 'light' : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
